name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; skip superseded runs rather than queueing them.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # `build:web` skips `tsc -b` on purpose: the repo currently has 17
      # pre-existing type errors, and Vite strips types without checking them
      # anyway, so type-checking here would only block deploys. Run
      # `npm run build` locally to see them.
      - run: npm run build:web -- --base=/${{ github.event.repository.name }}/
        env:
          # Repo Settings → Secrets and variables → Actions → Variables.
          # e.g. https://your-user-gvsm-map-explorer-api.hf.space
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # The review site, written into this artifact's root: /<repo>/ is the
      # map and /<repo>/about.html its title page. It shares the directory
      # with dev.html rather than sitting in a subfolder, so a bare URL lands
      # somewhere real instead of on a 404.
      #
      # This step is what puts a map on the site at all — build:web above no
      # longer builds explore.html, so that the app is not published twice
      # under two names.
      #
      # Only while it has nowhere better to live: setting the REVIEW_SITE_REPO
      # variable moves it elsewhere (see the review-site job) and this step
      # stops running, so the two never publish at once.
      #
      # Must run *after* build:web, which empties dist/; this one adds to it.
      - if: vars.REVIEW_SITE_REPO == ''
        run: npm run build:review -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # Once the review site has moved, its old URLs here would 404 — and some
      # of them are already in reviewers' hands. Leave a forwarding page at
      # each, carrying any query string and hash across.
      - if: vars.REVIEW_SITE_REPO != ''
        name: Point the old review URLs at the new site
        env:
          REVIEW_SITE_REPO: ${{ vars.REVIEW_SITE_REPO }}
          REVIEW_SITE_PATH: ${{ vars.REVIEW_SITE_PATH }}
        run: |
          set -euo pipefail
          eval "$(scripts/review-site-target.sh)"
          for page in index.html explore.html about.html; do
            target="$REVIEW_SITE_URL"
            [ "$page" = about.html ] && target="${REVIEW_SITE_URL}about.html"
            cat > "dist/$page" <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=$target">
          <link rel="canonical" href="$target">
          <title>Moved</title>
          <script>location.replace('$target' + location.search + location.hash)</script>
          <p>This page has moved to <a href="$target">$target</a>.</p>
          HTML
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publish the review site outside this repository, so its URL reads as a
  # standalone site rather than a subsection of this one. Pages takes the path
  # from the repo name, which is the whole reason this cannot be done with a
  # build flag here.
  #
  # Dormant until these are set in Settings → Secrets and variables → Actions:
  #
  #   variable REVIEW_SITE_REPO        owner/name, e.g. huizhml/huizhml.github.io
  #   variable REVIEW_SITE_PATH        folder inside it, e.g. vsm — optional for
  #                                    a dedicated repo, required for a user site
  #   secret   REVIEW_SITE_DEPLOY_KEY  private half of a write-enabled deploy
  #                                    key on that repository
  #
  # Two modes, chosen by REVIEW_SITE_PATH:
  #
  #   unset  the repo is the review site's alone: its gh-pages branch is
  #          replaced wholesale by one force-pushed commit.
  #   set    the repo is shared — typically the owner's homepage, served at
  #          <owner>.github.io/. Only that folder of its default branch is
  #          rewritten, as an ordinary commit; everything else is left alone.
  #
  # A deploy key rather than a PAT: it grants exactly one repository, and the
  # workflow's own GITHUB_TOKEN cannot write outside this one. For the same
  # reason this pushes a branch instead of using actions/deploy-pages, which
  # only ever publishes to the repository it runs in.
  review-site:
    if: vars.REVIEW_SITE_REPO != ''
    runs-on: ubuntu-latest
    # Two runs pushing into the same folder would race; the later one wins.
    concurrency:
      group: review-site
      cancel-in-progress: true
    env:
      REVIEW_SITE_REPO: ${{ vars.REVIEW_SITE_REPO }}
      REVIEW_SITE_PATH: ${{ vars.REVIEW_SITE_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Work out where it goes
        run: scripts/review-site-target.sh >> "$GITHUB_ENV"

      - name: Build the review site
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build:review -- --base="$REVIEW_SITE_BASE" --outDir ../dist-review

      - name: Push it to the review repository
        env:
          DEPLOY_KEY: ${{ secrets.REVIEW_SITE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "REVIEW_SITE_REPO is set but REVIEW_SITE_DEPLOY_KEY is not." >&2
            echo "Add the secret, or clear the variable to go back to publishing" >&2
            echo "the review site as a subpath of the main Pages site." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          remote="git@github.com:${REVIEW_SITE_REPO}.git"
          message="deploy ${GITHUB_SHA::7} from ${GITHUB_REPOSITORY}"

          if [ -z "$REVIEW_SITE_PATH" ]; then
            cd dist-review
            # Pages runs Jekyll otherwise, which drops any path with a leading
            # underscore. Nothing here has one today; this keeps it that way.
            touch .nojekyll
            git init -q -b gh-pages
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -q -m "$message"
            # One commit, force-pushed. The review repo is a publishing target,
            # not a history — keeping every past build would grow it without
            # bound, and the real history lives here.
            git push -q -f "$remote" gh-pages
            exit 0
          fi

          # Shared repo: its default branch, shallow — only the tip is needed.
          git clone -q --depth 1 "$remote" site
          cd site
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="$(git rev-parse --abbrev-ref HEAD)"

          # The homepage may be edited between our fetch and our push. Rather
          # than rebase (a shallow clone has no history to rebase against),
          # start again from the new tip: this commit is only ever "replace
          # one folder", which is cheap to redo.
          for attempt in 1 2 3; do
            git fetch -q --depth 1 origin "$branch"
            git reset -q --hard FETCH_HEAD
            # Replace the folder outright, so files a previous build had and
            # this one does not (old hashed bundles) go with it. Nothing outside
            # it is touched — the path was checked to be a plain relative folder.
            rm -rf -- "$REVIEW_SITE_PATH"
            mkdir -p -- "$REVIEW_SITE_PATH"
            cp -R ../dist-review/. "$REVIEW_SITE_PATH/"
            git add -A -- "$REVIEW_SITE_PATH"
            if git diff --cached --quiet; then
              echo "No change under $REVIEW_SITE_PATH/; nothing to push."
              exit 0
            fi
            git commit -q -m "$message"
            git push -q origin "HEAD:$branch" && exit 0
          done
          echo "Could not push to $REVIEW_SITE_REPO after 3 attempts." >&2
          exit 1
