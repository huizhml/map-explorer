name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; skip superseded runs rather than queueing them.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # `build:web` skips `tsc -b` on purpose: the repo currently has 17
      # pre-existing type errors, and Vite strips types without checking them
      # anyway, so type-checking here would only block deploys. Run
      # `npm run build` locally to see them.
      - run: npm run build:web -- --base=/${{ github.event.repository.name }}/
        env:
          # Repo Settings → Secrets and variables → Actions → Variables.
          # e.g. https://your-user-gvsm-map-explorer-api.hf.space
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # The review site, written into this artifact's root: /<repo>/ is the
      # title page and /<repo>/explore.html the map. It shares the directory
      # with dev.html rather than sitting in a subfolder, so a bare URL lands
      # somewhere real instead of on a 404.
      #
      # This step is what puts a map on the site at all — build:web above no
      # longer builds explore.html, so that the app is not published twice
      # under two names.
      #
      # Only while it has nowhere better to live: setting the REVIEW_SITE_REPO
      # variable moves it to its own repository (see the review-site job) and
      # this step stops running, so the two never publish at once and there is
      # no window where neither URL works.
      #
      # Must run *after* build:web, which empties dist/; this one adds to it.
      - if: vars.REVIEW_SITE_REPO == ''
        run: npm run build:review -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publish the review site to a repository of its own, so its URL reads as a
  # standalone site rather than a subsection of this one. Pages takes the path
  # from the repo name, which is the whole reason this cannot be done with a
  # build flag here.
  #
  # Dormant until two things are set in Settings → Secrets and variables →
  # Actions:
  #
  #   variable REVIEW_SITE_REPO        owner/name, e.g. huizhml/map-explorer-review
  #   secret   REVIEW_SITE_DEPLOY_KEY  private half of a write-enabled deploy
  #                                    key on that repository
  #
  # A deploy key rather than a PAT: it grants exactly one repository, and the
  # workflow's own GITHUB_TOKEN cannot write outside this one. For the same
  # reason this pushes a branch instead of using actions/deploy-pages, which
  # only ever publishes to the repository it runs in.
  review-site:
    if: vars.REVIEW_SITE_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The base is the repo name alone — 'huizhml/x' becomes '/x/'.
      - name: Build the review site
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          REVIEW_SITE_REPO: ${{ vars.REVIEW_SITE_REPO }}
        run: npm run build:review -- --base=/${REVIEW_SITE_REPO#*/}/ --outDir ../dist-review

      - name: Push it to the review repository
        env:
          DEPLOY_KEY: ${{ secrets.REVIEW_SITE_DEPLOY_KEY }}
          REVIEW_SITE_REPO: ${{ vars.REVIEW_SITE_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "REVIEW_SITE_REPO is set but REVIEW_SITE_DEPLOY_KEY is not." >&2
            echo "Add the secret, or clear the variable to go back to publishing" >&2
            echo "the review site as a subpath of the main Pages site." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          cd dist-review
          # Pages runs Jekyll otherwise, which drops any path with a leading
          # underscore. Nothing here has one today; this keeps it that way.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::7} from ${GITHUB_REPOSITORY}"
          # One commit, force-pushed. The review repo is a publishing target,
          # not a history — keeping every past build would grow it without
          # bound, and the real history lives here.
          git push -q -f "git@github.com:${REVIEW_SITE_REPO}.git" gh-pages
