# Litestream config for the map-explorer saved_features SQLite DB.
# Streams WAL frames to Cloudflare R2 (S3-compatible) continuously,
# and takes a full snapshot every 24h with 30-day retention.

dbs:
  # Env-driven, not hardcoded: this was pointed at the placeholder inside the
  # repo while the app had long since been writing to /projects (see the
  # SAVED_FEATURES_DB_PATH note in scripts/env.sh), so every replica was a
  # backup of an empty file. Keep this the same value the app runs with.
  - path: ${SAVED_FEATURES_DB_PATH}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: saved_features
        endpoint: ${LITESTREAM_ENDPOINT}
        region: auto
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        retention: 720h
        retention-check-interval: 24h
        snapshot-interval: 24h
        validation-interval: 6h
