# Litestream config for the map-explorer saved_features SQLite DB.
# Streams WAL frames to Cloudflare R2 (S3-compatible) continuously,
# and takes a full snapshot every 24h with 30-day retention.

dbs:
  - path: /home/ksb781/map-explorer/backend/data/saved_features.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: saved_features
        endpoint: ${LITESTREAM_ENDPOINT}
        region: auto
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        retention: 720h
        retention-check-interval: 24h
        snapshot-interval: 24h
        validation-interval: 6h
